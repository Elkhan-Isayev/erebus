name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build renderer and main
        run: npm run build

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # electron-builder shells out to rpmbuild for the .rpm target.
      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      # A packaged app that will not start is the bug users meet first, and no unit test
      # sees it. Every artifact is installed and launched before it can be published.
      - name: Verify macOS build installs and launches
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          for app in release/mac-arm64/Erebus.app release/mac/Erebus.app; do
            [ -d "$app" ] || continue
            echo "== $app"
            codesign --verify --deep --strict --verbose=1 "$app"
          done
          node scripts/smoke-launch.mjs "release/mac-arm64/Erebus.app/Contents/MacOS/Erebus"

      - name: Verify Linux build installs and launches
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get install -y ./release/Erebus-linux-amd64.deb xvfb
          node scripts/smoke-launch.mjs /opt/Erebus/erebus --xvfb
          chmod +x release/Erebus-linux-x86_64.AppImage
          ./release/Erebus-linux-x86_64.AppImage --appimage-extract > /dev/null
          node scripts/smoke-launch.mjs "$PWD/squashfs-root/erebus" --xvfb

      - name: Verify Windows build installs and launches
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -FilePath 'release/Erebus-win-x64-setup.exe' -ArgumentList '/S' -Wait
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Erebus\Erebus.exe",
            "$env:ProgramFiles\Erebus\Erebus.exe",
            "${env:ProgramFiles(x86)}\Erebus\Erebus.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "installer did not put Erebus.exe anywhere we looked" }
          Write-Host "installed at $exe"
          node scripts/smoke-launch.mjs $exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: erebus-${{ matrix.os }}
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -lh release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: release/*
